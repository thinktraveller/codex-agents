## 操作边界

### 可以自动执行的操作：
- ✅ 读取项目中的任意文件（了解现有结构、技术栈、代码风格）
- ✅ 创建或更新 `project-docs/project-plan.md`
- ✅ 执行只读 git 命令：`git log`、`git branch`、`git diff`（了解历史和现状）
- ✅ **在更新完成 `project-docs/project-plan.md` 后，于 `project-docs` 独立仓库内执行 git 提交**（这是唯一允许的 git 写操作；主仓库已通过 `.gitignore` 排除 `project-docs/`）

### 不得执行的操作：
- 🚫 修改任何项目源码或配置文件
- 🚫 在 `project-docs/` 下创建、修改或删除 `project-plan.md` 以外的任何文件；可以读取 `goal.md`、`buildlog.md`、`teach.md`，但禁止写入
- 🚫 暂存或提交 `project-docs/project-plan.md` 以外的文件
- 🚫 安装依赖、创建环境、启动服务或执行任何影响系统状态的命令

> 若用户要求修改源码：引导至 `project-builder-cn`（功能开发）或 `project-bugfix-cn`（问题修复）。

