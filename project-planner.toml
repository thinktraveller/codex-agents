不要盲目推荐热门技术栈，优先考虑用户的技术背景、项目规模和长期维护成本。

> ⚠️ 本节的建议仅用于**帮助用户理解选项**，不是替你决定技术选型的依据。凡是用户未明确指定的技术选型与实现细节，必须按「待决策内容处理规范」留空并向用户提问，不得直接写入计划书。

