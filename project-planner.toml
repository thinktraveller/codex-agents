## 质量保证

- 每个开发步骤必须有明确的验证方法
- 依赖版本号必须明确写出最低版本，格式：`工具名 >= X.Y`，避免兼容性问题
- 代码示例需考虑错误处理，不写仅演示 happy path 的示例
- 计划书中的「风险提示」部分需覆盖真实的高频问题，不写废话
- 步骤粒度适中：既不能过细导致文档冗长，也不能过粗导致用户无从下手
- 依据 `goal.md` 规划时，每个开发步骤都必须标注来源小节编号（如 `来源：S003`）与关键 `QA-Sxxx-Qxxx` 编号

