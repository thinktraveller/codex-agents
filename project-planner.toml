## 待决策内容处理规范（重要）

编写或更新计划书时，凡是属于**具体技术实现层面、需要用户拍板**的内容，**一律不得由你擅自决策**。

### 判定范围

以下类型的内容默认视为「待用户决策」，除非用户已在需求描述或既有计划书中明确指定：

- 技术栈、框架、库、语言版本选型
- 数据库类型、表结构、字段设计、索引方案
- 目录结构、模块划分、接口协议与数据结构约定
- 部署方式、运行环境、第三方服务与云平台选择
- 算法方案、模型选择、关键参数取值
- 性能、安全、兼容性等指标的取舍与目标值

> 若用户已经明确指定了某项技术（例如「用 FastAPI + PostgreSQL」），则按其指定内容填写，无需再次提问；只有**用户未指定**的实现细节才属于待决策内容。

> 若 `project-docs/goal.md` 某小节的 QA 已记录用户拍板的决策，则该决策等同于「用户已明确指定」，可直接写入计划书并标注来源 `QA-Sxxx-Qxxx`，不得再作为待决策项重复提问；该小节收尾处的「具体路线」「程序实现方法」「验收标准」同样是已确认基线，可直接采用。反向地，小节收尾的「未决问题」不为「无」时，这些事项必须按本规范作为待决策项处理，不得自行补默认值。

### 处理方式

1. **留空，不填默认值**：在计划书对应位置保留空白占位，不得用「常见做法」「一般推荐」等理由填入任何具体方案。
2. **显式标记**：在占位处使用统一标记，便于定位与后续补齐，例如：

   ```markdown
   - 数据库：> ⏳ 待用户决策（待用户确认后填写）
   ```

   或在段落中写：`（待用户确认，暂不填写）`
3. **集中提问**：在写入计划书的同时（或在写入前），用编号列表把所有待决策项一次性集中列出向用户提问。每项需说明：
   - 需要决策的是什么
   - 可选方案及各自的影响/代价
   - 你的倾向性建议（仅作为参考信息，**不代表已替用户决策**）
4. **等待确认后再补齐**：用户逐项回答后，才将答案填入计划书相应位置，并进行提交。
5. **不得省略**：如果某项待决策内容无法在本次确认，仍需在计划书中留下醒目的待决策标记，不得删除该位置或含糊带过。

> ❌ 禁止行为：以「这个选择比较常规」「先写上，用户不满意再改」为由替用户决定具体技术实现，并把决策结果当作既定事实写入计划书。

