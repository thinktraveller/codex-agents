## 最终交付强制检查

在向用户宣告任务完成前，必须逐项执行，任何一项不满足都不得交付：

1. **内容完整性**：确认本轮形成的全部规划内容、可行性结论、风险、步骤和重要 Q&A 已写入 `project-docs/project-plan.md`。
2. **唯一输出文件**：执行 `git -C project-docs status --short`（主仓库已通过 `.gitignore` 排除 `project-docs/`，因此审计必须在 `project-docs` 仓库内进行）。planner 在 `project-docs/` 内必须写入且只允许写入 `project-plan.md`；禁止写入 `goal.md`、`buildlog.md`、`teach.md` 或任何未获允许的其他文件。
3. **越界处理**：若检测到本 agent 造成的其他文件改动，必须停止交付并纠正，只撤销本 agent 的越界改动，不得覆盖或撤销用户原有变更。
4. **精确提交**：`project-docs/` 是独立 Git 仓库，提交必须在 `project-docs` 仓库内执行，禁止使用 `git add .` 或 `git add -A`。必须执行并核对：

```powershell
git -C project-docs status --short
git -C project-docs add project-plan.md
git -C project-docs diff --cached --name-only
git -C project-docs commit -m "docs: 创建或更新构建计划书"
git -C project-docs rev-parse --short HEAD
```

> 📌 **双仓库提交规则**：本 agent 通常只产出文档，一般只需 `project-docs` 仓库的 1 次提交。若本次任务同时改动了主仓库中的文件，必须再按工作流在**主仓库**补一次提交，使一次任务产生 **2 个 Git 提交**（主仓库提交不含 `project-docs/` 与 `_verify/`）；若主仓库确无改动，如实说明即可，不得伪造空提交。

5. **需求来源追溯审计**：若本次规划依据 `project-docs/goal.md`，逐个开发步骤核对来源标注，确认每条规划都能追溯到具体小节编号与 `QA-Sxxx-Qxxx`，且所引用小节的状态均为 `已完成`、用户一致性确认为「一致」。发现无法追溯、引用了未收尾小节，或与用户已拍板结论相悖的内容，必须在交付前修正或改为待决策项。
6. **待决策项审计**：逐条核对计划书中所有技术实现细节，确认没有本 agent 擅自作出的选型或设计决策。凡属用户未指定的实现细节，必须保持留空并带 `⏳ 待用户决策` 标记；同时确认这些待决策项已**集中向用户提问**，且提交内容只包含用户已确认的部分。若发现擅自决策，必须在交付前改为留空并补充提问。
7. **完成判定**：只有 `project-plan.md` 内容检查通过、需求来源追溯审计通过、待决策项审计通过、暂存区没有其他文件且 `git -C project-docs commit` 成功后，任务才算完成。最终回复必须给出 `project-docs/project-plan.md`、提交哈希，以及**当前仍待用户决策的事项清单**。若 `project-docs/` 不是独立 Git 仓库、Git 身份未配置或提交失败，必须说明阻塞原因，且不得声称任务已完成。

