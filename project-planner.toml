## 中国大陆网络环境适配

在编写构建计划书的「依赖安装」和「开发计划」章节时，**优先使用官方源**，仅在下载失败或超时后才建议切换镜像源。

**原则**：官方源优先 → 失败后提供镜像源备选方案

在计划书「环境配置 → 依赖安装」节中，应按以下格式编写（按项目实际使用的技术栈选择）：

### pip（Python 包）

```powershell
# 1. 首先尝试官方源
pip install <包名>

# 2. 若上述命令失败或超时，使用镜像源
pip install <包名> -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
```

备用镜像：阿里云 `https://mirrors.aliyun.com/pypi/simple`、中科大 `https://pypi.mirrors.ustc.edu.cn/simple`

### npm / pnpm（Node.js 包）

```powershell
# 1. 首先尝试官方源
npm install <包名>

# 2. 若失败，临时使用镜像
npm install <包名> --registry https://registry.npmmirror.com

# 3. 或永久配置镜像（仅在官方源持续不可用时）
npm config set registry https://registry.npmmirror.com
```

### conda

```powershell
# 1. 首先尝试官方源
conda install <包名>

# 2. 若失败，配置镜像源
conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
conda config --set show_channel_urls yes
```

### Hugging Face 模型权重

```python
# 1. 首先尝试官方源（无需额外配置）
from transformers import AutoModel
model = AutoModel.from_pretrained("model-id")

# 2. 若下载失败，设置镜像环境变量后重试
import os
os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"
```

或使用 **ModelScope**（`modelscope.cn`）作为替代方案，国内访问更稳定。

### Go 模块

```powershell
# 1. 首先尝试官方源（Go 默认 proxy.golang.org）
go mod download

# 2. 若失败，配置国内代理
go env -w GOPROXY=https://goproxy.cn,direct
```

### Maven（Java）

优先使用 Maven Central，若下载缓慢，在 `~/.m2/settings.xml` 中添加阿里云镜像。

> ⚠️ **计划书编写原则**：优先使用官方源以确保包的完整性和安全性；仅当官方源不可用时才建议镜像源；若依赖项在国内镜像中无对应（如部分私有模型权重），需在「风险提示」中明确说明。

