## 工作流程

> 🧭 **项目结构预检（开始前先确认）**：确认 `project-docs/` 是独立 Git 仓库（存在 `project-docs/.git`）、`_verify/`、`reference-projects/` 与 `AGENTS.md` 已就位。若缺少，提示用户先调用 **project-initializer-cn** 完成初始化——主仓库通过 `.gitignore` 排除了 `project-docs/`，未初始化时计划书无法提交到独立仓库。

### 第零步：需求来源确认（必须首先执行）

当用户提出「创建计划书」「更新计划书」或含义相近的请求时，**不得直接动笔编写**。必须先确认需求来源，识别用户属于以下哪种情况：

- **情况 A：用户已给出明确需求**（说明了要实现的功能、目标、范围或硬性约束）
  → 需求明确，可以进入「前置检索：检查现有计划书」。

- **情况 B：用户指定了 `goal.md` 的某一小节**（例如「按 `goal.md` 的小节 S003 更新计划书」）
  → 先按「goal.md 小节消费规范」完整读取并校验该小节：确认小节状态为 `已完成`、用户一致性确认为「一致」、该小节 QA 已全部回填、小节收尾已写明具体路线与程序实现方法。
  → 校验通过后，向用户复述你对该小节「需求具象化 + QA 结论 + 小节收尾」的理解并确认无误，再进入「前置检索：检查现有计划书」。
  → 若该小节仍为「进行中」、用户一致性确认未完成，或收尾处「未决问题」不为「无」，必须停止规划，提示用户先回到 **project-creator-cn** 走完三步法；不得基于未收尾的小节编写计划书，也不得替用户补齐缺失的决策。

- **情况 C：用户只说了「创建/更新计划书」，但没有明确需求，也未指定 `goal.md` 的具体小节**
  → **必须停下来向用户提问，要求其明确需求**。不得依据猜测、经验或常见做法替用户设计需求，也不得先写一版「草稿」再让用户改。至少确认：
  1. 本次要实现或变更什么（功能、目标、范围边界）
  2. 是否已有需求文档（如 `project-docs/goal.md`）可以依据，或需要指定其中的哪一小节
  3. 是否有必须遵守的技术约束、兼容性要求或已知禁区

  提问后**等待用户回答**。在需求未明确之前，不得创建或更新 `project-docs/project-plan.md`，不得提交 git。

> ❌ 禁止行为：需求模糊时自行假设功能范围、技术栈、验收标准或开发步骤并直接生成计划书。

### goal.md 小节消费规范（规划依据目标文档时必读）

`project-docs/goal.md` 中的需求澄清采用「小节 Sxxx + 小节内 QA」结构，读取时必须遵循：

1. **定位小节**：按 `<!-- GOAL-SECTION-Sxxx-START -->` 与 `<!-- GOAL-SECTION-Sxxx-END -->` 定位小节边界，不得跨小节混用内容，也不得改写、删除或合并小节。
2. **只采信四类内容**：
   - 「1. 需求具象化（程序实现）」：作为功能范围、交互行为与数据预期的依据；
   - 「2. 用户一致性确认」：只有结论为「一致」时，该小节才可作为规划依据；
   - 「3. 本小节 QA（用户拍板决策）」：`QA-Sxxx-Qxxx` 的「提炼结论」等同于用户已拍板的决策，可直接采用并标注来源编号；
   - 「4. 小节收尾：路线与程序实现方法」：经用户确认的「具体路线」「程序实现方法」「验收标准」作为规划基线；「未决问题」必须按「待决策内容处理规范」处理，不得自行补默认值。
3. **校验小节状态**：引用前必须确认小节状态为 `已完成`。若小节仍为「进行中」，停止规划并提示用户先回到 **project-creator-cn** 完成该小节的三步法。
4. **汇总章节**：`goal.md` 的「汇总：核心目标 / 汇总：目标用户 / 汇总：期望成果 / 汇总：成功标准 / 范围界定 / 约束条件」作为整体约束；与小节内容冲突时以小节内用户确认的结论为准，并向用户指出冲突，等待用户裁定。
5. **旧版内容**：若 `goal.md` 中仍保留旧版 `## 澄清问答记录` 与 `QA-Rxxx` 轮次块，仅作历史参考，不作为拍板依据；涉及这些内容时必须回到用户确认。
6. **追溯要求**：依据 `goal.md` 生成的每个开发步骤，都必须在计划书中标注来源小节编号与小节内关键 `QA-Sxxx-Qxxx` 编号。
7. **只读边界**：只读取 `goal.md`，禁止创建、修改、删除或暂存 `goal.md`；需要补充或修正需求时，引导用户回到 **project-creator-cn**。

### 前置检索：检查现有计划书（紧随需求来源确认之后执行）

在处理用户的规划请求之前，**必须先检查** `project-docs/project-plan.md` 是否已存在：

1. 检索 `project-docs/` 目录下是否有 `project-plan.md` 文件
2. **若存在**：
   - 完整阅读现有计划书，了解项目的历史背景、已完成的规划、技术选型和开发计划
   - 向用户汇报发现：
     > 「检测到现有构建计划书，项目名称：[项目名]，已规划 N 个开发步骤。我将基于现有计划进行增量更新。」
   - 后续新增的计划内容将**追加到现有计划书的末尾**，而非覆盖
3. **若不存在**：
   - 告知用户将创建新的计划书
   - 按照标准模板结构创建完整的计划书

> ⚠️ **增量更新原则**：当用户提出新需求或提供需求文档时，新的开发计划应作为新的步骤追加到现有「开发计划」章节的末尾，步骤编号顺延（如原有步骤 1-5，新增步骤从 6 开始）。已有的项目概述、技术选型等章节除非用户明确要求修改，否则保持不变。

---

### 正式工作流程

1. 理解用户需求，必要时提出 2-3 个澄清问题（不要一次问太多）
   - 若用户未给出明确需求、也未指定 `goal.md` 的具体小节，必须先按「第零步：需求来源确认」提问并等待回答；需求明确前不得进入后续步骤
   - 若用户提供了需求文档或指定了 `goal.md` 小节，先按「goal.md 小节消费规范」完整阅读并校验，再进入可行性分析与规划
   - 若存在现有计划书，结合历史上下文理解新需求与已有规划的关系
2. 进行可行性分析，诚实评估，说明主要风险
3. 确认用户理解并接受方案后，设计分步实施计划
4. 写入 `project-docs/project-plan.md`：
   - **若为新建**：创建 `project-docs/` 目录（如不存在）并创建完整计划书
   - **若为增量更新**：
     - 在「开发计划」章节末尾追加新步骤，步骤编号顺延
     - 如有必要，更新「项目概述」中的功能列表
     - 向用户展示变更摘要（新增了哪些步骤），等用户确认后再写入
   - **若为修改现有内容**：先向用户展示变更摘要，等用户确认后再写入，**不得静默覆盖**
   - **待决策项处理**：任何用户未明确指定的技术实现细节一律留空并标记 `⏳ 待用户决策`，同时集中向用户提问；只有用户确认后的内容才允许写入并提交
5. 逐步引导用户完成各阶段，回答追问
6. 将重要 Q&A 记录到文档，持续优化
7. 计划书完成后，执行「最终交付强制检查」并**在 `project-docs` 独立仓库中立即提交**：

```powershell
git -C project-docs add project-plan.md
git -C project-docs commit -m "docs: 创建/更新构建计划书"
git -C project-docs rev-parse --short HEAD
```

> 📌 若本次任务同时改动了主仓库中的文件，还必须按工作流在**主仓库**补一次提交，确保一次任务产生 **2 个 Git 提交**（主仓库提交不含 `project-docs/` 与 `_verify/`）。

8. 提交完成后，告知用户下一步：

> ✅ 构建计划书已生成并提交：`project-docs/project-plan.md`
>
> 下一步请使用 **project-builder-cn** 开始执行构建：
> 「请开始执行项目构建」

