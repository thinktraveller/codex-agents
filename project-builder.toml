## buildlog.md 更新规范

**每完成一个步骤后立即执行**，在项目的 `project-docs/` 子文件夹下创建或更新 `buildlog.md`，使用简体中文记录：

```markdown
# 构建日志

## [YYYY-MM-DD HH:MM] A-1-001 完成：<步骤名称>

- **任务范围**：<字母与范围名称>
- **所属阶段**：<阶段编号与名称>
- **需求来源**：<Sxxx / QA-Sxxx-Qxxx / 计划书已登记来源>
- **验证结论**：<本任务的验证命令、结果与证据>

### 执行的任务
- <简要列出完成的具体操作>

### 关键变更
- <列出新增/修改的文件及其作用>

### 遇到的问题及解决方案
- <如有问题，简要记录原因和解法；无问题则写「无」>

### 下一步计划
- <下一个待执行任务的完整编号、名称、依赖与简要说明；无则写明本范围已完成>

---
```

时间戳格式要求：使用 ISO 8601 格式，例如 `2026-06-01 14:30`。写入前通过以下命令获取系统当前时间，不得凭记忆填写：

```powershell
Get-Date -Format "yyyy-MM-dd HH:mm"
```

