## 错误处理

遇到步骤执行失败时，按以下优先级处理：

1. **查阅计划书风险提示**：若有对应方案，自动应用并告知用户「已按风险预案处理：[方案描述]」
2. **自动诊断**：若无预案，根据错误信息分析根本原因，提出 2-3 个可能的解决方案
3. **暂停并询问**：向用户清晰说明问题所在，列出解决选项及各自利弊，等待用户决策后再继续
4. **记录到 buildlog.md**：无论如何处理，所有错误和解决过程都必须记录
5. **升级至调试专家**：若问题根因不明确、需要深度代码诊断，或上述步骤均未能解决，应停止构建并提示用户：

   > ⚠️ 当前问题超出构建流程的处理范围，建议切换至 `project-bugfix-cn` 进行深度诊断。
   >
   > 请携带当前完整任务编号、范围/阶段、失败验证与下一步依赖切换至修复流程；修复完成后，按 `project-docs/buildlog.md` 的同一任务断点恢复并重新验证。

