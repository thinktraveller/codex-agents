## Git 提交规范

**每完成一个步骤后立即执行**。当前工作流使用两个仓库：

- **主仓库**（项目根目录）：追踪源码与配置，`.gitignore` 已排除 `project-docs/`、`_verify/` 与 `reference-projects/`
- **project-docs 仓库**（`project-docs/`）：独立仓库，负责 `buildlog.md` 等全部文档

每个正式步骤按实际变更分别提交：源码与日志都变更时产生 2 个 Git 提交，纯文档步骤只提交文档库，无变更的仓库不制造空提交。两个提交说明均引用同一完整任务编号。提交前先检查两个仓库的待提交文件列表：

- `_verify/` 目录下的脚本不得出现（应在验证通过后已删除，且已被主仓库 `.gitignore` 忽略）
- `.env`、密钥文件、编译产物不得出现

```powershell
git status                            # 1. 检查主仓库待提交文件列表
git -C project-docs status --short    # 2. 检查文档仓库待提交文件列表
```

```powershell
# ① 主仓库：只提交本步骤涉及的源码与配置文件
git add <本步骤涉及的具体文件路径>
git diff --cached --name-only
git commit -m "构建 A-1-001: <简要描述本步骤完成的内容>"

# ② project-docs 仓库：提交本步骤的构建日志
git -C project-docs add buildlog.md
git -C project-docs diff --cached --name-only
git -C project-docs commit -m "docs: 记录 A-1-001 构建日志"
```

> ⚠️ 禁止使用 `git add .` 或 `git add -A`（两个仓库均适用），必须**明确列出本步骤涉及的文件路径**，避免误提交 `.env`、密钥文件、`_verify/` 脚本等无关内容。

### 最终交付强制检查

在向用户宣告当前构建任务完成前，必须逐项执行：

1. **日志完整性**：确认每个已完成步骤、验证结果、实际变更、问题处理和下一步计划都已写入 `project-docs/buildlog.md`，均引用与计划书一致的完整任务编号、范围与阶段；旧日志通过映射追溯，不能只存在于聊天回复中。
2. **文档边界审计**：执行 `git -C project-docs status --short`（主仓库已通过 `.gitignore` 排除 `project-docs/`，因此审计必须在 `project-docs` 仓库内进行），确认本 agent 在 `project-docs/` 下只改动了 `buildlog.md`，没有写入 `goal.md`、`project-plan.md`、`teach.md` 或其他文件。
3. **越界处理**：若发现本 agent 造成的越界文档改动，必须停止交付并纠正；只撤销本 agent 的越界改动，不得覆盖或撤销用户原有变更。
4. **提交审计**：在主仓库使用明确路径暂存源码与配置并执行 `git diff --cached --name-only`；再用 `git -C project-docs add buildlog.md` 并在文档库核对暂存区，确认均仅有本步骤获准改动的文件且引用同一任务编号。两库都变更时必须各有成功提交；无变更的仓库如实说明，不制造空提交。
5. **完成判定**：只有正式任务编号与范围核对通过、`buildlog.md` 已更新、文档边界检查通过且各实际变更仓库的提交成功后，任务才算完成；最终回复必须给出完整任务编号、范围/阶段、`project-docs/buildlog.md` 和本次实际提交的哈希（通过对应仓库的 `git rev-parse --short HEAD` 获取）。无变更仓库明确注明未提交，不把旧 HEAD 冒充本次提交。若仓库不独立、Git 身份未配置或提交失败，说明阻塞原因，不得声称任务已完成。

