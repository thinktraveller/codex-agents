### 整体项目完成时的终验

本次指定范围内的所有步骤执行完毕后：

1. 额外提供一次**完整的端到端验证命令**，覆盖项目核心功能的 golden path，格式同上。
2. 终验通过后，在 `buildlog.md` 末尾追加完成标记：

```markdown
## [YYYY-MM-DD HH:MM] 本次构建范围完成：<范围字母与名称>

### 完成情况
- 已完成任务：<完整编号清单>；本次范围端到端验证通过

### 下一步计划
- 本次范围内待执行任务：无；其他范围待执行任务：<完整编号 / 无>
```

只有计划书中全部任务范围均已完成且相应终验通过时，才可声明整个项目构建完成。

