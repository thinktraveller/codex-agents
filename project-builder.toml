## Git 提交规范

**每完成一个步骤后立即执行**。当前工作流使用两个仓库：

- **主仓库**（项目根目录）：追踪源码与配置，`.gitignore` 已排除 `project-docs/` 与 `_verify/`
- **project-docs 仓库**（`project-docs/`）：独立仓库，负责 `buildlog.md` 等全部文档

因此**每个步骤都必须产生 2 个 Git 提交**。提交前先检查两个仓库的待提交文件列表：

- `_verify/` 目录下的脚本不得出现（应在验证通过后已删除，且已被主仓库 `.gitignore` 忽略）
- `.env`、密钥文件、编译产物不得出现

```powershell
git status                            # 1. 检查主仓库待提交文件列表
git -C project-docs status --short    # 2. 检查文档仓库待提交文件列表
```

```powershell
# ① 主仓库：只提交本步骤涉及的源码与配置文件
git add <本步骤涉及的具体文件路径>
git diff --cached --name-only
git commit -m "构建步骤 N: <简要描述本步骤完成的内容>"

# ② project-docs 仓库：提交本步骤的构建日志
git -C project-docs add buildlog.md
git -C project-docs diff --cached --name-only
git -C project-docs commit -m "docs: 记录构建步骤 N 日志"
```

> ⚠️ 禁止使用 `git add .` 或 `git add -A`（两个仓库均适用），必须**明确列出本步骤涉及的文件路径**，避免误提交 `.env`、密钥文件、`_verify/` 脚本等无关内容。

### 最终交付强制检查

在向用户宣告当前构建任务完成前，必须逐项执行：

1. **日志完整性**：确认每个已完成步骤、验证结果、实际变更、问题处理和下一步计划都已写入 `project-docs/buildlog.md`，不能只存在于聊天回复中。
2. **文档边界审计**：执行 `git -C project-docs status --short`（主仓库已通过 `.gitignore` 排除 `project-docs/`，因此审计必须在 `project-docs` 仓库内进行），确认本 agent 在 `project-docs/` 下只改动了 `buildlog.md`，没有写入 `goal.md`、`project-plan.md`、`teach.md` 或其他文件。
3. **越界处理**：若发现本 agent 造成的越界文档改动，必须停止交付并纠正；只撤销本 agent 的越界改动，不得覆盖或撤销用户原有变更。
4. **提交审计**：在主仓库使用明确路径暂存源码与配置并执行 `git diff --cached --name-only`；再用 `git -C project-docs add buildlog.md` 并在 `project-docs` 仓库执行 `git diff --cached --name-only`，确认两个仓库都没有无关文件。每个步骤都必须产生 **2 个成功的本地 Git 提交**（主仓库 + `project-docs` 仓库）；若某步骤确实没有主仓库改动，则不产生空提交，并如实说明。
5. **完成判定**：分别执行 `git rev-parse --short HEAD` 与 `git -C project-docs rev-parse --short HEAD` 获取两个仓库的提交哈希。只有 `buildlog.md` 已更新、文档边界检查通过且两个仓库的 `git commit` 都成功后，任务才算完成；最终回复必须给出 `project-docs/buildlog.md` 和两个提交哈希。若根目录不是 Git 仓库、`project-docs/` 不是独立仓库、Git 身份未配置或提交失败，必须说明阻塞原因，且不得声称任务已完成。

