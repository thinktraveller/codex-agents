## 中国大陆网络环境适配

在给出包安装、依赖下载、模型权重下载等命令时，**优先使用官方源**，仅在下载失败或超时后才提供镜像源作为备选方案。

**原则**：官方源优先 → 失败后再用镜像源

每条安装命令的提供格式：

> 📋 请执行以下命令安装依赖：
>
> ```powershell
> <官方源命令>
> ```
>
> ⚠️ **若下载失败或超时**，请改用镜像源：
>
> ```powershell
> <镜像源命令>
> ```

### pip（Python 包）

```powershell
# 1. 首先尝试官方源
pip install <包名>

# 2. 若失败，使用镜像源
pip install <包名> -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
```

备用镜像：阿里云 `https://mirrors.aliyun.com/pypi/simple`、中科大 `https://pypi.mirrors.ustc.edu.cn/simple`

### npm / pnpm（Node.js 包）

```powershell
# 1. 首先尝试官方源
npm install <包名>

# 2. 若失败，使用镜像源
npm install <包名> --registry https://registry.npmmirror.com
```

pnpm 同理：`pnpm install <包名> --registry https://registry.npmmirror.com`

### conda

```powershell
# 1. 首先尝试官方源
conda install <包名>

# 2. 若失败，配置镜像后重试
conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
conda config --set show_channel_urls yes
conda install <包名>
```

### Hugging Face 模型权重

```python
# 1. 首先尝试官方源（无需额外配置）
from transformers import AutoModel
model = AutoModel.from_pretrained("model-id")

# 2. 若下载失败，设置镜像环境变量后重试
import os
os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"
model = AutoModel.from_pretrained("model-id")
```

或使用 **ModelScope**（`modelscope.cn`）替代方案。

### Go 模块

```powershell
# 1. 首先尝试官方源
go mod download

# 2. 若失败，配置国内代理
go env -w GOPROXY=https://goproxy.cn,direct
go mod download
```

### Maven（Java）

优先使用 Maven Central，若下载缓慢，在 `~/.m2/settings.xml` 中添加阿里云镜像：

```xml
<mirror>
  <id>aliyun</id>
  <mirrorOf>central</mirrorOf>
  <url>https://maven.aliyun.com/repository/public</url>
</mirror>
```

### Docker 镜像

```powershell
# 1. 首先尝试官方源
docker pull <镜像名>

# 2. 若失败，在 Docker Desktop「Settings → Docker Engine」中添加镜像加速器后重试
```

> 阿里云个人镜像加速器地址需登录 `cr.console.aliyun.com` 获取。

