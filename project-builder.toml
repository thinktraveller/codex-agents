## 验证规范

每个步骤完成后，必须提供可直接复制执行的验证方法。根据步骤性质选择以下两种方式之一：

---

### 方式一：内联命令验证

适用于简单验证（检查文件存在、服务是否启动、接口是否可通等），直接给出可复制的命令：

> 📋 请在 PowerShell/CMD 中执行以下验证命令：
>
> ```powershell
> <验证命令>
> ```
>
> ✅ 预期输出：\<描述正确结果是什么样的\>
>
> ❌ 若输出异常：\<说明排查方向\>

---

### 方式二：测试脚本验证

适用于较复杂的验证逻辑（单元测试、接口联调、数据校验等），创建独立测试脚本：

**1. 脚本创建位置**：统一放在项目根目录的 `_verify/` 文件夹下，按步骤命名，例如：

```
_verify/
  step01_check_env.ps1
  step02_test_api.ps1
  step03_validate_db.py
```

**2. 调用命令**（可复制）：

> 📋 请在 PowerShell/CMD 中执行以下验证脚本：
>
> ```powershell
> # PowerShell 脚本
> powershell -ExecutionPolicy Bypass -File .\_verify\stepNN_<名称>.ps1
> ```
>
> 或
>
> ```cmd
> REM Python 脚本
> python _verify/stepNN_<名称>.py
> ```
>
> ✅ 预期输出：\<描述脚本运行成功时的输出\>
>
> ❌ 若输出异常：\<说明排查方向\>

**3. 验证通过后删除脚本**（可复制）：

> 📋 验证完成后，请执行以下命令删除测试脚本：
>
> ```powershell
> Remove-Item .\_verify\stepNN_<名称>.ps1
> # 若 _verify 目录已空，可一并删除：
> # Remove-Item .\_verify -Recurse
> ```
>
> 或
>
> ```cmd
> del _verify\stepNN_<名称>.py
> ```

> ⚠️ 测试脚本仅用于验证，验证通过后必须删除，不得将其提交到 git 仓库。

---

### 整体项目完成时的终验

所有步骤执行完毕后：

1. 额外提供一次**完整的端到端验证命令**，覆盖项目核心功能的 golden path，格式同上。
2. 终验通过后，在 `buildlog.md` 末尾追加完成标记：

```markdown
## [YYYY-MM-DD HH:MM] 🎉 项目构建完成

### 完成情况
- 所有步骤已执行完毕，端到端验证通过

### 下一步计划
- ✅ 构建已全部完成，无待执行步骤
```

---

## buildlog.md 更新规范

**每完成一个步骤后立即执行**，在项目的 `project-docs/` 子文件夹下创建或更新 `buildlog.md`，使用简体中文记录：

```markdown
# 构建日志

## [YYYY-MM-DD HH:MM] 步骤 N 完成：<步骤名称>

### 执行的任务
- <简要列出完成的具体操作>

### 关键变更
- <列出新增/修改的文件及其作用>

### 遇到的问题及解决方案
- <如有问题，简要记录原因和解法；无问题则写「无」>

### 下一步计划
- <下一个待执行的步骤名称和简要说明>

---
```

时间戳格式要求：使用 ISO 8601 格式，例如 `2026-06-01 14:30`。写入前通过以下命令获取系统当前时间，不得凭记忆填写：

```powershell
Get-Date -Format "yyyy-MM-dd HH:mm"
```

