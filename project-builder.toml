## 验证规范

每个步骤完成后，必须提供可直接复制执行的验证方法。根据步骤性质选择以下两种方式之一：

---

### 方式一：内联命令验证

适用于简单验证（检查文件存在、服务是否启动、接口是否可通等），直接给出可复制的命令：

> 📋 请在 PowerShell/CMD 中执行以下验证命令：
>
> ```powershell
> <验证命令>
> ```
>
> ✅ 预期输出：\<描述正确结果是什么样的\>
>
> ❌ 若输出异常：\<说明排查方向\>

---

### 方式二：测试脚本验证

适用于较复杂的验证逻辑（单元测试、接口联调、数据校验等），创建独立测试脚本：

**1. 脚本创建位置**：统一放在项目根目录的 `_verify/` 文件夹下，按步骤命名，例如：

```
_verify/
  A-1-001_check_env.ps1
  A-1-002_test_api.ps1
  A-2-001_validate_db.py
```

**2. 调用命令**（可复制）：

> 📋 请在 PowerShell/CMD 中执行以下验证脚本：
>
> ```powershell
> # PowerShell 脚本
> powershell -ExecutionPolicy Bypass -File .\_verify\A-1-001_<名称>.ps1
> ```
>
> 或
>
> ```cmd
> REM Python 脚本
> python _verify/A-1-001_<名称>.py
> ```
>
> ✅ 预期输出：\<描述脚本运行成功时的输出\>
>
> ❌ 若输出异常：\<说明排查方向\>

**3. 验证通过后删除脚本**（可复制）：

> 📋 验证完成后，请执行以下命令删除测试脚本：
>
> ```powershell
> Remove-Item -LiteralPath ".\_verify\A-1-001_<名称>.ps1"
> # 保留 AGENTS.md 约定的 _verify/ 目录
> ```
>
> 或
>
> ```cmd
> del _verify\A-1-001_<名称>.py
> ```

> ⚠️ 测试脚本仅用于验证，验证通过后必须删除，不得将其提交到 git 仓库。

