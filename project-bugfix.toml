## Git 提交规范

**每次修复验证通过后立即执行**。当前工作流使用两个仓库：

- **主仓库**（项目根目录）：追踪源码与配置，`.gitignore` 已排除 `project-docs/`、`_verify/` 与 `reference-projects/`
- **project-docs 仓库**（`project-docs/`）：独立仓库，负责 `buildlog.md` 等全部文档

修复源码与日志都变更时必须产生 2 个 Git 提交；仅有文档改动时只提交文档库，无变更仓库不制造空提交。有已规划任务时，两库提交说明均引用同一完整编号，独立未编排修复则如实说明。提交前检查待提交文件，确认 `_verify/` 脚本已删除、无调试产物混入：

```powershell
git status                            # 1. 检查主仓库待提交文件列表
git -C project-docs status --short    # 2. 检查文档仓库待提交文件列表
```

```powershell
# ① 主仓库：只提交本次修复涉及的源码与配置
git add <本次修复涉及的具体文件路径>
git diff --cached --name-only
git commit -m "fix(A-1-001): <简要描述修复的问题>"

# ② project-docs 仓库：提交修复日志
git -C project-docs add buildlog.md
git -C project-docs diff --cached --name-only
git -C project-docs commit -m "docs: 记录 A-1-001 修复日志"
```

提交信息格式参考：
- `fix(A-1-001): 修复登录接口因 token 未刷新导致的 401 错误`
- `fix: 修复无计划独立请求中的数据持久化问题（尚未编排）`

> ⚠️ 禁止使用 `git add .` 或 `git add -A`（两个仓库均适用），必须**明确列出本次修复涉及的文件路径**，避免误提交 `_verify/` 脚本、调试产物等无关内容。

### 最终交付强制检查

在向用户宣告当前修复任务完成前，必须逐项执行：

1. **日志完整性**：确认问题描述、根本原因、修复方案、变更文件、验证结果与构建断点都已写入 `project-docs/buildlog.md`；任务编号、范围与阶段和原计划一致，独立请求明确注明未编排，不伪造编号或误将父任务标为完成。
2. **文档边界审计**：执行 `git -C project-docs status --short`（主仓库已通过 `.gitignore` 排除 `project-docs/`，因此审计必须在 `project-docs` 仓库内进行），确认本 agent 在 `project-docs/` 下只改动了 `buildlog.md`，没有写入 `goal.md`、`project-plan.md`、`teach.md` 或其他文件。
3. **越界处理**：若发现本 agent 造成的越界文档改动，必须停止交付并纠正；只撤销本 agent 的越界改动，不得覆盖或撤销用户原有变更。
4. **提交审计**：在主仓库精确暂存本次修复涉及的源码并核对暂存区；再用 `git -C project-docs add buildlog.md` 并核对文档库暂存区，确认均只含本次获准变更。两库都变更时必须各有成功提交；无变更仓库明确说明，不制造空提交；已有任务时两个提交说明引用同一编号。
5. **完成判定**：只有日志、任务关联、断点与文档边界检查通过且各实际变更仓库的提交成功后，修复任务才算完成。最终回复给出关联的完整任务编号（或未编排说明）、`project-docs/buildlog.md`、本次实际提交的哈希（通过相应仓库的 `git rev-parse --short HEAD` 获取）与待恢复的构建任务；不把旧 HEAD 冒充本次提交。若仓库不独立、Git 身份未配置或提交失败，说明阻塞原因，不得声称任务已完成。

