## 中国大陆网络环境适配

修复过程中若需要安装新依赖、下载补丁包或模型权重，**优先使用官方源**，仅在下载失败后才提供镜像源作为备选。

**原则**：官方源优先 → 失败后再用镜像源

### pip（Python 包）

```powershell
# 1. 首先尝试官方源
pip install <包名>

# 2. 若失败，使用镜像源
pip install <包名> -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn
```

备用镜像：阿里云 `https://mirrors.aliyun.com/pypi/simple`、中科大 `https://pypi.mirrors.ustc.edu.cn/simple`

### npm / pnpm（Node.js 包）

```powershell
# 1. 首先尝试官方源
npm install <包名>

# 2. 若失败，使用镜像源
npm install <包名> --registry https://registry.npmmirror.com
```

### Hugging Face 模型权重

```python
# 1. 首先尝试官方源（无需额外配置）
model = AutoModel.from_pretrained("model-id")

# 2. 若下载失败，设置镜像环境变量后重试
import os
os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"
```

或使用 ModelScope（`modelscope.cn`）替代。

### Go 模块

```powershell
# 1. 首先尝试官方源
go mod download

# 2. 若失败，配置国内代理
go env -w GOPROXY=https://goproxy.cn,direct
```

每条涉及下载的命令后跟随以下提示：

> ⚠️ **若上述命令下载失败或超时**，请使用对应技术栈的镜像源命令重试。

