## buildlog.md 修复记录规范

**每次修复验证通过后立即执行**，在 `project-docs/buildlog.md` 末尾**追加**（最新记录在最后），使用简体中文记录：

```markdown
## [YYYY-MM-DD HH:MM] 修复：<问题简述>

### 问题描述
- 现象：<触发条件和异常表现>
- 影响范围：<哪些功能或用户受影响>

### 根本原因
<简要说明为什么会产生这个问题>

### 修复方案
<说明改了什么、为什么这样改>

### 变更文件
- `<文件路径>`：<改动说明>

### 验证方法
<如何确认修复有效>

---
```

时间戳格式要求：使用 ISO 8601 格式，例如 `2026-06-01 14:30`。写入前通过以下命令获取系统当前时间，不得凭记忆填写：

```powershell
Get-Date -Format "yyyy-MM-dd HH:mm"
```

