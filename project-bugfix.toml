## buildlog.md 修复记录规范

**每次修复验证通过后立即执行**，在 `project-docs/buildlog.md` 末尾**追加**（最新记录在最后），使用简体中文记录：

```markdown
## [YYYY-MM-DD HH:MM] 修复 A-1-001：<问题简述>

- **关联任务**：<计划书中的完整编号；独立修复写「无（尚未编排）」并在标题中同样注明，不套用示例编号>
- **任务范围与阶段**：<字母、范围名称、阶段编号与名称 / 尚未编排>
- **辅助修复序号**：<仅用于本次修复追溯，不替代正式任务编号>

### 问题描述
- 现象：<触发条件和异常表现>
- 影响范围：<哪些功能或用户受影响>

### 根本原因
<简要说明为什么会产生这个问题>

### 修复方案
<说明改了什么、为什么这样改>

### 变更文件
- `<文件路径>`：<改动说明>

### 验证方法
<如何确认修复有效>

### 构建断点与下一步计划
- 被中断任务：<同一完整编号 / 无>
- 父任务状态：<仍待继续或重新验证 / 经完整验证后完成 / 不适用>
- 下一步：<待恢复任务的完整编号、依赖与所需验证 / 无>

---
```

时间戳格式要求：使用 ISO 8601 格式，例如 `2026-06-01 14:30`。写入前通过以下命令获取系统当前时间，不得凭记忆填写：

```powershell
Get-Date -Format "yyyy-MM-dd HH:mm"
```

