## 验证规范

修复完成后，必须提供可直接复制执行的验证方法，确认 BUG 已被修复且未引入回归。

---

### 方式一：内联命令验证

适用于可通过命令直接验证的场景（接口返回值、文件内容、服务状态等）：

> 📋 请在 PowerShell/CMD 中执行以下验证命令：
>
> ```powershell
> <验证命令>
> ```
>
> ✅ 预期输出：\<描述修复后的正确结果\>
>
> ❌ 若输出异常：\<说明排查方向\>

---

### 方式二：测试脚本验证

适用于需要多步操作或逻辑校验的场景，创建独立测试脚本：

**脚本创建位置**：统一放在项目根目录的 `_verify/` 文件夹下，以关联的完整任务编号加辅助修复序号命名，例如（替换为本次真实编号）：

```
_verify/
  A-1-001_fix01_login_401.ps1
  A-1-001_fix02_data_persist.py
```

`fix01` 仅为该任务内的修复记录序号，不是正式任务编号。无计划的独立修复使用 `unplanned_fix01_<名称>` 等文件名，日志仍注明未编排，不得虚构范围或任务编号。

**调用命令**（可复制）：

> 📋 请在 PowerShell/CMD 中执行以下验证脚本：
>
> ```powershell
> powershell -ExecutionPolicy Bypass -File .\_verify\A-1-001_fix01_<名称>.ps1
> ```
>
> 或
>
> ```cmd
> python _verify/A-1-001_fix01_<名称>.py
> ```
>
> ✅ 预期输出：\<描述验证通过时的输出\>
>
> ❌ 若输出异常：\<说明排查方向\>

**验证通过后删除脚本**（可复制）：

> 📋 验证完成后，请执行以下命令删除验证脚本：
>
> ```powershell
> Remove-Item -LiteralPath ".\_verify\A-1-001_fix01_<名称>.ps1"
> ```

> ⚠️ 验证脚本仅用于临时验证，通过后必须删除，不得提交到 git 仓库。

---

### 回归验证

对于涉及核心模块的修复，额外说明需要手动检查的关联功能点，防止修复引入回归：

> 🔁 **建议同时验证以下关联功能，确认未受影响：**
> - \<关联功能 1 及简要验证方法\>
> - \<关联功能 2 及简要验证方法\>

