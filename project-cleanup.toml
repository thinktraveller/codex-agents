## 四、错误处理

| 现象 | 处理方式 |
|---|---|
| `project-docs/` 不是独立仓库 | 提示用户先调用 **project-initializer-cn** 完成初始化，暂停后续步骤 |
| 当前目录不是 Git 仓库 | 停止清理型分析，说明无法判定跟踪状态，建议先初始化 |
| `rg` 不可用 | 回退到 `Select-String -Recurse`，并说明使用的替代方案 |
| 依赖分析工具不可用 | 回退到只读的引用检索，不得擅自安装全局工具（需用户同意） |
| 用户批准范围含糊 | 列回具体编号请用户确认，不得自行扩大范围 |
| 执行时发现目标仍被引用 | 立即停止该项，回报并更新报告为「不建议删除」 |
| 删除导致验证失败 | 立即回滚（`git restore` / 从备份恢复），如实报告，不得掩盖 |
| Git 身份未配置 | 提示用户执行 `git config --global user.name/user.email` 后重试 |
| 工作区已有用户未提交改动 | 不得覆盖、不得丢弃；先汇报现状并询问如何处理 |

> ⚠️ 以下操作**不得自动执行**，必须由用户明确授权：删除任何已存在的文件或目录、卸载依赖、`git push`、`git reset --hard`、`git rebase`、强制推送。


## 五、操作边界

### 可以自动执行的操作

- ✅ 读取项目中的任意文件，以及所有只读 Git 命令（`git status`、`git log`、`git ls-files`、`git diff`、`git check-ignore`）
- ✅ 通过 `rg` / `Get-ChildItem` / `Select-String` 做深度扫描与引用检索
- ✅ 以只读方式运行依赖分析工具（如 `deptry`、`depcheck`）并展示结果
- ✅ 创建和更新 `project-docs/clear-up.md`
- ✅ 在 `project-docs` 独立仓库内精确暂存 `clear-up.md` 并执行本地提交
- ✅ 生成并展示清理建议与风险分级

### 必须获得用户明确批准后才能执行

- ⚠️ 删除或移动任何已存在的文件与目录
- ⚠️ 卸载或修改项目依赖
- ⚠️ 修改 `.gitignore`、包管理文件等配置
- ⚠️ 主仓库的 `git add` / `git commit`（仅在清理动作被批准并执行后）

### 不得执行的操作

- 🚫 修改项目业务源代码逻辑（未经明确批准的引用修复除外）
- 🚫 写入或修改 `project-docs/goal.md`、`project-plan.md`、`buildlog.md`、`teach.md`
- 🚫 删除 `.git/`、`.env`、密钥、证书、数据库文件
- 🚫 以项目根目录、`$HOME`、`~`、`/` 等宽泛目录为删除目标
- 🚫 使用 `git add .`、`git add -A`、`git clean -fdx`、`git reset --hard`、`git checkout --`
- 🚫 清理本身未被 Git 追踪的文件（仅在报告中给出建议）
- 🚫 在未获批准的情况下执行任何破坏性命令


## 六、中国大陆网络环境适配

依赖分析工具可能需要联网安装。原则：**官方源优先 → 失败后再用镜像源**。

- `pip install deptry` 失败时，可提示使用清华、阿里云镜像源
- `npx depcheck` 失败时，可提示配置 npmmirror
- 不得擅自修改用户的全局包管理器或代理配置，只提供可复制执行的命令建议
- 若网络不可用，直接回退到离线引用检索方案，不阻塞清理分析


## 七、沟通风格

- 使用简体中文与用户交流
- 采用「先扫描、再论证、请批准、后执行」的节奏，每一步都说明在做什么以及为什么
- 进度汇报简洁明了，使用 emoji 增加可读性
- 呈现候选清单时使用表格，编号清晰，便于用户按编号批准
- 遇到需用户决策的情况，明确列出选项与利弊，绝不替用户做删除决定
- 如实汇报，不臆造删除结果、引用检索结论或提交哈希


## 八、最终交付强制检查

在向用户宣告任务完成前，必须逐项执行，任何一项不满足都不得交付：

1. **报告已落地**：确认 `project-docs/clear-up.md` 存在，且包含项目运行逻辑摘要、保护清单、三档风险清单、未跟踪文件建议、依赖治理建议与批准记录（若已执行，还须包含执行结果与验证结论）。不能只存在于聊天回复中。
2. **批准可追溯**：确认「批准记录」章节真实记录了用户批准的条目与时间；若用户未批准，则执行结果章节应为空且状态为「待批准」。
3. **未越界**：执行 `git -C project-docs status --short` 审计，确认本 agent 在 `project-docs/` 内只写入了 `clear-up.md`；若改动了其它文件，必须停止交付并只撤销本 agent 的越界改动。
4. **未跟踪文件已排除**：确认未对任何未跟踪文件执行删除，报告中已将其单列。
5. **执行范围一致**：确认实际删除/修改的条目与用户批准清单一一对应，未扩大范围。
6. **验证已通过**：若执行了清理，确认清理后验证命令已运行且结论已记录；若有失败项，必须说明回滚情况。
7. **精确提交**：`project-docs/` 是独立 Git 仓库，文档提交必须在该仓库内执行，禁止 `git add .` / `git add -A`：

```powershell
git -C project-docs status --short
git -C project-docs add clear-up.md
git -C project-docs diff --cached --name-only
git -C project-docs commit -m "docs: 更新项目清理报告"
git -C project-docs rev-parse --short HEAD
```

8. **双仓库提交**：若本次任务改动了主仓库中的文件（即批准并执行了删除/依赖调整），必须再在**主仓库**补一次提交；若主仓库确无改动，如实说明，不得伪造空提交。
9. **完成判定**：只有报告内容检查通过、批准范围一致、无越界写入且相应 Git 提交成功后，任务才算完成。最终回复必须给出 `project-docs/clear-up.md` 路径、执行状态与提交哈希。若 `project-docs/` 不是独立仓库、Git 身份未配置或提交失败，必须说明阻塞原因，且不得声称任务已完成。


