## 解释规范

根据用户问题的性质，自动选择以下三种粒度之一，不要对简单问题给出过度详细的回答：

### 宏观解释（架构级）

适用于：「这个项目是怎么运作的」「整体架构是什么」

- 描述模块划分和各模块职责
- 描述核心数据流和请求路径
- 说明关键技术选型的原因（若能推断）
- 不涉及具体实现细节

### 中观解释（模块级）

适用于：「这个模块是怎么实现的」「X 和 Y 是怎么协作的」

- 描述模块内部的主要组件和职责划分
- 说明对外接口和依赖关系
- 解释关键的设计决策
- 适当引用关键文件路径，不逐行解释代码

### 微观解释（代码级）

适用于：「这个函数做什么」「这个参数是什么意思」「为什么这里要这样写」

- 精确解释特定代码片段的行为
- 说明边界条件和异常处理
- 若有不明确之处，直接说明「这里逻辑不透明，以下是推测」

---

## 操作边界

### 可以自动执行的操作：
- ✅ 读取项目中的任意文件
- ✅ 执行只读的 git 命令：`git log`、`git diff`、`git branch`（了解历史和分支）
- ✅ **创建和更新 `project-docs/teach.md`**（必须，项目地图完成后立即初始化，每次有价值的问答后追加记录）
- ✅ **调用 `archify` 技能生成架构图 HTML**：仅限用户明确说明「初次理解项目」时，产物只写入 `project-docs/docs/`（详见「初次理解项目：调用 archify 生成架构图 HTML」）
- ✅ 在 `project-docs` 独立仓库内精确暂存 `teach.md` 与 `docs/` 下的 archify 产物，并执行本地 Git 提交（主仓库已通过 `.gitignore` 排除 `project-docs/`）

### 不得执行的操作：
- 🚫 修改任何项目源码或配置文件
- 🚫 在 `project-docs/` 下创建、修改或删除 `teach.md` 与 `docs/` 下 archify 产物以外的任何文件；可以读取 `goal.md`、`project-plan.md`、`buildlog.md`，但禁止写入
- 🚫 暂存或提交 `project-docs/teach.md` 与 `docs/` 下 archify 产物以外的文件
- 🚫 安装依赖、启动服务或运行项目
- 🚫 在用户未明确说明「初次理解项目」时调用 `archify` 生成 HTML（不确定时先确认，不得自行推断）

> 若用户要求修改代码：引导至 `project-builder-cn`（功能开发）或 `project-bugfix-cn`（问题修复）。
>
> 若用户要求规划新功能：完成第三步「二次开发衔接」；范围已明确时引导至 planner，需新增/复用范围判断时先引导至 creator，再进入规划。

