## 初次理解项目：调用 archify 生成架构图 HTML

### 触发条件（严格）

**仅当用户明确说明这是初次理解该项目时才执行**，例如：

- 「我是第一次看这个项目」「我第一次接触这个项目」
- 「我完全不了解这个项目，帮我从零理解它的整体架构」
- 「初次理解项目，请给我一份整体架构图」

判定要求同时满足两点：用户**明确表达了「初次 / 第一次理解该项目」**，且本次需要产出可视化理解材料。

- 语义含糊时，先用一句话确认：「本次是否属于『初次理解项目』？确认后我会用 archify 生成一份可交互的架构图 HTML。」得到确认后再执行。
- 禁止仅凭「项目陌生」「没有构建文档」「代码量大」等线索自行推断触发；用户未说明时只输出文字版项目地图，不生成 HTML。
- 后续轮次中的追问（如「这个模块怎么实现的」）不重复触发；除非用户再次明确要求重新做一次初识级别的整体理解。

### 执行方式

调用 `archify` 技能（`SKILL.md` 位于 `C:/Users/joyjo/.codex/skills/archify/SKILL.md`），严格按其工作流执行：

1. 完整读取该技能的 `SKILL.md`，遵守其中的 Fast authoring path、作者不变式与交付契约。
2. 选择图类型：整体架构用 `architecture`，核心业务流程用 `workflow`，请求/调用链路用 `sequence`，数据管道用 `dataflow`，状态流转用 `lifecycle`。初次理解项目默认从 `architecture` 开始。
3. 依据真实代码证据（第一步建立的项目地图与源码文件）编写 JSON 规格，不得凭想象编造组件；`meta.quality_profile` 设为 `"showcase"`，`meta.locale` 设为 `"zh-CN"`（与用户使用简体中文交流保持一致）。
4. 使用技能自带 CLI 先校验、后交付，两步都成功才算完成：

```powershell
node <archify 技能目录>/bin/archify.mjs validate <type> <candidate.json> --quality showcase --json
node <archify 技能目录>/bin/archify.mjs deliver <type> <candidate.json> project-docs/docs/<项目名>-architecture.html --quality showcase --json
```

5. `deliver` 返回非零退出时不得声称成功；按技能指引只修改被诊断的字段后重试，两轮无改善则如实汇报未解决的诊断。
6. 交付后按技能要求报告 HTML 路径、图类型、校验摘要、规格/产物回执与浏览器证据状态；未实际执行的视觉检查不得声称为已完成。

### 产物位置（固定）

| 产物 | 路径 |
|---|---|
| 学习笔记（始终产出） | `project-docs/teach.md` |
| 架构图 HTML（初次理解项目时产出） | `project-docs/docs/<项目名>-architecture.html` |
| archify 自身生成的伴随文件（如规格快照） | 与 HTML 同目录，即 `project-docs/docs/` |

- `teach.md` 必须位于 `project-docs/` 下，不得放进 `project-docs/docs/` 或其他位置。
- HTML 必须位于 `project-docs/docs/` 下，不得放在 `project-docs/` 根目录或项目主仓库的其他目录。
- 生成 HTML 后，在 `project-docs/teach.md` 的「项目概览」中补记 `- **架构图 HTML**：docs/<项目名>-architecture.html`，必要时补一句说明该图覆盖的范围。
- 学习笔记、架构图及其规格快照均属于默认私有的文档仓库；保留既定产物位置，不为展示而复制到公开主体仓库或自行上传公开站点。关联已有正式任务时，在笔记中记录该完整编号，架构组件名称仍按真实代码命名。

> `archify` 技能内部的 `node bin/archify.mjs` 校验、交付与浏览器证据命令属于本 agent 的允许操作，不计入「安装依赖、启动服务或运行项目」。

