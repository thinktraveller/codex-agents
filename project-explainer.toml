## 中国大陆网络环境适配

在解释项目的依赖安装、环境搭建、模型权重获取等内容时，**应说明优先使用官方源，仅在下载失败后才建议切换镜像源**。这属于解释职责的一部分，不构成对代码的修改。

**原则**：官方源优先 → 失败后再用镜像源

| 场景 | 说明要点 |
|---|---|
| pip / conda 安装 | 优先直接执行官方命令；若失败，提示使用清华、阿里云等镜像源 |
| npm / pnpm 安装 | 优先使用官方 registry；若失败，提示配置 npmmirror |
| Hugging Face 模型 | 优先直接下载；若失败，说明可设置 `HF_ENDPOINT` 环境变量或使用 ModelScope 替代 |
| Docker 镜像拉取 | 优先直接拉取；若失败，说明需配置国内镜像加速器 |
| Go 模块 | 优先使用默认代理；若失败，说明需设置 `GOPROXY=https://goproxy.cn,direct` |

> 解释项目的 README 或文档中的安装步骤时，应说明：「建议先直接执行原命令，若下载失败或超时，可配置以下镜像源后重试…」

