## teach.md 维护规范

### 初始化结构

在第一步地图完成后，于项目的 `project-docs/` 子文件夹下创建 `teach.md`，使用简体中文：

```markdown
# [项目名称] 学习笔记

## 项目概览
- **一句话描述**：<这个项目是什么，解决什么问题>
- **技术栈**：<语言 / 框架 / 数据库>
- **项目类型**：<Web 应用 / CLI 工具 / 库 / 自动化脚本 / ...>
- **架构图 HTML**：`docs/<项目名>-architecture.html`（仅在用户明确说明初次理解项目、已用 archify 生成时填写；未生成则写「未生成」）
- **关联任务**：<已有完整任务编号、范围与阶段 / 无（尚未编排）；学习笔记的模块名不是正式任务编号>

## 架构与模块

### <模块名>
- **职责**：<这个模块做什么>
- **关键文件**：<路径>
- **对外接口**：<暴露了哪些接口 / 函数 / 事件>

## 核心数据流
<关键业务流程的文字描述或 ASCII 流程图>

## 设计说明
<非显而易见的设计决策；解释"为什么这样设计"而非"做了什么">

## Q&A 记录

### <模块名 或 通用问题>

**Q：** <用户问题>
**A：** <解答内容>
**关联任务：** <相关完整编号 / 无（尚未编排）>

## 二次开发备忘

### [YYYY-MM-DD HH:MM] <改造目标简述>

**需求**：<用户描述>
**涉及模块**：<相关模块和文件>
**结合点**：<接入位置>
**已知复杂度**：<潜在障碍>
**既有范围与任务**：<字母、范围/阶段及相关完整编号 / 尚未编排>
**新增范围判断依据**：<goal 已确认的新增/复用结论与 Sxxx / QA-Sxxx-Qxxx；缺失则写待 creator 明确，不自行新开号>
```

### 更新规则

| 时机 | 操作 |
|---|---|
| 第一步完成后 | 在 `project-docs/` 下创建并写入骨架 |
| 用户明确说明初次理解项目并用 archify 生成架构图后 | 在「项目概览」补记架构图 HTML 路径 |
| 回答有记录价值的问题后 | 将 Q&A 追加到对应模块子节 |
| 发现重要设计决策时 | 主动补充「设计说明」节 |
| 用户表达二次开发意图时 | 在「二次开发备忘」节追加改造分析 |

> ⚠️ 只追加或更新局部内容，**不重写全文**。`project-docs/teach.md` 是累积式文档，每次对话的新理解叠加在已有内容之上。

### 时间戳获取

「二次开发备忘」节需要时间戳。写入前通过以下命令获取系统当前时间，不得凭记忆填写：

```powershell
Get-Date -Format "yyyy-MM-dd HH:mm"
```

